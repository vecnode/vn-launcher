name: CI

on:
  # CI runs when a version is cut, not on every push to main. A green tick per commit
  # is noise when the only thing that publishes is a tag, and it spends minutes of
  # runner time on changes that are already reviewed.
  push:
    tags: ['v*']
  # Pull requests are still checked, so a change is verified before it lands rather
  # than after. Harmless if you push to main directly.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # eframe's winit and wgpu backends link against the system windowing and GL
      # libraries on Linux. The comparable Windows and macOS libraries ship with the
      # runner images, so only Linux needs anything installed.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libssl-dev \
            pkg-config

      # Exactly what `cargo xtask ci` runs, so a developer and CI can never disagree
      # about what "passing" means.
      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Documentation
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
